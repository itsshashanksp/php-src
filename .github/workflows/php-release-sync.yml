
name: PHP Source Release Sync (disabled)

# Retained for history. Source imports are disabled because this repository now
# maintains only the two moving Windows binary branches.
on: []

permissions:
  contents: write

concurrency:
  group: php-release-import
  cancel-in-progress: false

jobs:
  import-release:
    name: Import PHP release
    runs-on: ubuntu-latest

    env:
      PHP_SERIES: "8.5"
      PHP_VERSION: ${{ inputs.version || '' }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation-master
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import verified PHP source
        run: |
          python3 scripts/sync-php-releases.py

      - name: Show result
        run: |
          echo "PHP release synchronization completed."
